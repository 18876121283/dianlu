<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>重力 G – 质量 m 关系曲线生成器</title>
<style>
  :root{
    --bg:#f4f6fb;
    --card:#ffffff;
    --text:#1f2937;
    --muted:#6b7280;
    --line:#e5e7eb;
    --accent:#2563eb;
    --accent-dark:#1d4ed8;
    --accent-soft:#eff6ff;
    --danger:#dc2626;
    --shadow:0 6px 24px rgba(15,23,42,.07);
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    font-size:14px;
    line-height:1.5;
  }
  .app{max-width:1240px;margin:0 auto;padding:28px 20px 40px}
  header{margin-bottom:20px}
  header h1{margin:0 0 6px;font-size:24px;letter-spacing:.3px}
  header p{margin:0;color:var(--muted)}
  .layout{display:grid;grid-template-columns:370px 1fr;gap:20px;align-items:start}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
  .controls{padding:18px}
  .tabs{display:flex;gap:6px;background:#f3f4f6;padding:4px;border-radius:9px;margin-bottom:14px}
  .tab{flex:1;border:0;background:transparent;padding:7px 4px;border-radius:6px;color:var(--muted);cursor:pointer;font-size:13px;font-weight:600}
  .tab.active{background:#fff;color:var(--accent);box-shadow:0 1px 4px rgba(15,23,42,.1)}
  .table-head,.row{display:grid;grid-template-columns:1fr 1fr 30px;gap:8px;align-items:center}
  .table-head{font-size:12px;color:var(--muted);padding:0 2px 6px}
  .table-head span:last-child{text-align:center}
  #rows{max-height:250px;overflow-y:auto;padding-right:2px}
  .row{margin-bottom:7px}
  input,textarea{
    width:100%;padding:8px 10px;border:1px solid #d1d5db;border-radius:7px;
    font:inherit;color:var(--text);background:#fff;outline:none;transition:border-color .15s,box-shadow .15s;
  }
  input:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
  input.bad{border-color:var(--danger);box-shadow:0 0 0 3px rgba(220,38,38,.1)}
  .del{border:0;background:transparent;color:#9ca3af;cursor:pointer;font-size:18px;line-height:1;border-radius:5px;height:30px}
  .del:hover{background:#fee2e2;color:var(--danger)}
  .link-btn{border:0;background:transparent;color:var(--accent);cursor:pointer;font-size:13px;padding:4px 0;font-weight:600}
  .link-btn:hover{color:var(--accent-dark)}
  textarea{resize:vertical;min-height:170px;line-height:1.6;font-family:ui-monospace,Consolas,monospace;font-size:13px}
  .hint{font-size:12px;color:var(--muted);margin:6px 0 0}
  .options{display:flex;flex-wrap:wrap;gap:12px;margin:16px 0;padding-top:14px;border-top:1px dashed var(--line)}
  .options label{display:flex;align-items:center;gap:5px;color:var(--muted);cursor:pointer;font-size:13px}
  .options input[type=checkbox]{width:auto;accent-color:var(--accent)}
  .actions{display:flex;gap:8px;flex-wrap:wrap}
  button.primary{
    flex:1;min-width:130px;border:0;border-radius:8px;background:var(--accent);color:#fff;
    padding:11px 14px;font-size:14px;font-weight:600;cursor:pointer;transition:background .15s,transform .1s;
  }
  button.primary:hover{background:var(--accent-dark)}
  button.primary:active{transform:translateY(1px)}
  button.secondary{
    border:1px solid #d1d5db;border-radius:8px;background:#fff;color:var(--text);
    padding:10px 12px;font-size:13px;cursor:pointer;
  }
  button.secondary:hover{background:#f9fafb;border-color:#9ca3af}
  #message{min-height:20px;margin:10px 0 0;font-size:12.5px;color:var(--muted)}
  #message.error{color:var(--danger)}
  #message.ok{color:#059669}
  .chart-panel{padding:18px 18px 14px;min-width:0}
  .chart-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px}
  .chart-head h2{margin:0;font-size:16px}
  .chart-wrap{position:relative;width:100%;height:440px}
  canvas{display:block;width:100%;height:100%;border-radius:8px}
  #tooltip{
    position:absolute;pointer-events:none;display:none;background:rgba(17,24,39,.92);color:#fff;
    padding:6px 9px;border-radius:6px;font-size:12px;white-space:nowrap;z-index:2;
    transform:translate(-50%,-130%);box-shadow:0 4px 12px rgba(0,0,0,.18);
  }
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
  .stat{background:#f8fafc;border:1px solid #eef2f7;border-radius:8px;padding:9px 11px;min-width:0}
  .stat .k{font-size:11px;color:var(--muted);margin-bottom:2px}
  .stat .v{font-size:14px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  [hidden]{display:none!important}
  @media(max-width:900px){
    .layout{grid-template-columns:1fr}
    .chart-wrap{height:360px}
    .stats{grid-template-columns:repeat(2,1fr)}
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>重力 G – 质量 m 关系曲线生成器</h1>
    <p>录入成对的质量 m（kg）与重力 G（N）数值，点击「生成曲线」即可画出 G–m 关系图。</p>
  </header>

  <main class="layout">
    <section class="panel controls">
      <div class="tabs">
        <button class="tab active" id="tab-table" type="button">逐点录入</button>
        <button class="tab" id="tab-paste" type="button">批量粘贴</button>
      </div>

      <div id="panel-table">
        <div class="table-head"><span>m (kg)</span><span>G (N)</span><span></span></div>
        <div id="rows"></div>
        <button class="link-btn" id="add-row" type="button">＋ 添加一行</button>
      </div>

      <div id="panel-paste" hidden>
        <textarea id="paste" spellcheck="false" placeholder="每行一个点：m, G&#10;例如：&#10;0, 0&#10;1, 9.8&#10;2, 19.6&#10;&#10;也支持空格 / 制表符分隔，# 开头为注释"></textarea>
        <p class="hint">支持逗号、空格或 Tab 分隔；m 相同的数据点会自动合并取平均。</p>
      </div>

      <div class="options">
        <label><input type="checkbox" id="opt-smooth" checked>平滑曲线</label>
        <label><input type="checkbox" id="opt-points" checked>显示数据点</label>
        <label><input type="checkbox" id="opt-grid" checked>显示网格</label>
      </div>

      <div class="actions">
        <button class="primary" id="generate" type="button">生成曲线</button>
        <button class="secondary" id="sample" type="button">示例数据</button>
        <button class="secondary" id="clear" type="button">清空</button>
      </div>
      <p id="message">已载入示例数据，可直接点击「生成曲线」查看效果。</p>
    </section>

    <section class="panel chart-panel">
      <div class="chart-head">
        <h2>函数关系曲线</h2>
        <button class="secondary" id="export" type="button">导出 PNG</button>
      </div>
      <div class="chart-wrap">
        <canvas id="chart"></canvas>
        <div id="tooltip"></div>
      </div>
      <div class="stats">
        <div class="stat"><div class="k">数据点数</div><div class="v" id="stat-count">—</div></div>
        <div class="stat"><div class="k">m 范围 (kg)</div><div class="v" id="stat-x">—</div></div>
        <div class="stat"><div class="k">G 范围 (N)</div><div class="v" id="stat-y">—</div></div>
        <div class="stat"><div class="k">曲线类型</div><div class="v" id="stat-type">—</div></div>
      </div>
    </section>
  </main>
</div>

<script>
(function(){
  'use strict';
  const $ = s => document.querySelector(s);
  const canvas = $('#chart');
  const ctx = canvas.getContext('2d');
  const tooltip = $('#tooltip');
  const message = $('#message');

  let points = [];          // {x, y}
  let screenPoints = [];    // {x, y, px, py}
  let hoverIndex = -1;
  let dpr = 1;
  let plotBox = null;

  const SAMPLE = [
    [0,0],[1,9.8],[2,19.6],[3,29.4],[4,39.2],
    [5,49],[6,58.8],[7,68.6],[8,78.4]
  ];

  function fmt(v){
    if(!isFinite(v)) return '—';
    const a = Math.abs(v);
    if(a !== 0 && (a >= 1e6 || a < 1e-4)) return v.toExponential(2);
    return String(parseFloat(v.toFixed(6)));
  }

  function setMessage(text, type){
    message.textContent = text;
    message.className = type || '';
  }

  function addRow(x, y){
    const row = document.createElement('div');
    row.className = 'row';
    const inX = document.createElement('input');
    inX.type = 'text'; inX.inputMode = 'decimal'; inX.placeholder = 'm'; inX.value = x === undefined ? '' : x;
    const inY = document.createElement('input');
    inY.type = 'text'; inY.inputMode = 'decimal'; inY.placeholder = 'G'; inY.value = y === undefined ? '' : y;
    const del = document.createElement('button');
    del.type = 'button'; del.className = 'del'; del.textContent = '×'; del.title = '删除该行';
    del.addEventListener('click', () => row.remove());
    row.append(inX, inY, del);
    $('#rows').appendChild(row);
  }

  function loadRows(data){
    $('#rows').innerHTML = '';
    data.forEach(p => addRow(p[0], p[1]));
  }

  function activeTab(){
    return $('#tab-paste').classList.contains('active') ? 'paste' : 'table';
  }

  function collect(){
    const raw = [];
    if(activeTab() === 'table'){
      const rows = Array.from($('#rows').children);
      rows.forEach((row, i) => {
        const a = row.children[0].value.trim();
        const b = row.children[1].value.trim();
        row.children[0].classList.remove('bad');
        row.children[1].classList.remove('bad');
        if(!a && !b) return;
        if(!a || !b){
          row.children[a ? 1 : 0].classList.add('bad');
          throw new Error('第 ' + (i + 1) + ' 行数据不完整，m 和 G 都要填写。');
        }
        const x = Number(a), y = Number(b);
        if(!isFinite(x) || !isFinite(y)){
          row.children[isFinite(x) ? 1 : 0].classList.add('bad');
          throw new Error('第 ' + (i + 1) + ' 行包含非数字内容。');
        }
        raw.push({x, y});
      });
    }else{
      const lines = $('#paste').value.split(/\r?\n/);
      lines.forEach((line, i) => {
        const t = line.trim();
        if(!t || t.startsWith('#') || t.startsWith('//')) return;
        const parts = t.split(/[\s,，\t]+/).filter(Boolean);
        if(parts.length < 2) throw new Error('第 ' + (i + 1) + ' 行需要两个数值（m, G）。');
        const x = Number(parts[0]), y = Number(parts[1]);
        if(!isFinite(x) || !isFinite(y)) throw new Error('第 ' + (i + 1) + ' 行包含非数字内容。');
        raw.push({x, y});
      });
    }
    if(raw.length < 2) throw new Error('至少需要 2 个有效数据点才能生成曲线。');

    // 按 X 升序排列；相同 X 合并取平均，保证是函数关系
    raw.sort((a, b) => a.x - b.x);
    const merged = [];
    let duplicates = 0;
    raw.forEach(p => {
      const last = merged[merged.length - 1];
      if(last && Math.abs(last.x - p.x) < 1e-12){
        last.sum += p.y; last.n += 1; duplicates++;
      }else{
        merged.push({x:p.x, sum:p.y, n:1});
      }
    });
    return {
      points: merged.map(m => ({x:m.x, y:m.sum / m.n})),
      duplicates
    };
  }

  function niceStep(range, target){
    if(!(range > 0)) return 1;
    const rough = range / target;
    const mag = Math.pow(10, Math.floor(Math.log10(rough)));
    const n = rough / mag;
    const mult = n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10;
    return mult * mag;
  }

  function tickText(v, step){
    const dec = Math.min(6, Math.max(0, -Math.floor(Math.log10(step))));
    return v.toFixed(dec);
  }

  function draw(){
    const rect = canvas.getBoundingClientRect();
    if(!rect.width || !rect.height) return;
    dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(rect.width * dpr);
    canvas.height = Math.round(rect.height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const W = rect.width, H = rect.height;
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, W, H);

    const m = {l:64, r:20, t:22, b:46};
    const pw = W - m.l - m.r, ph = H - m.t - m.b;
    plotBox = {x:m.l, y:m.t, w:pw, h:ph};

    if(points.length < 2){
      ctx.fillStyle = '#9ca3af';
      ctx.font = '14px -apple-system, "PingFang SC", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('请先录入数据，然后点击「生成曲线」', W / 2, H / 2);
      screenPoints = [];
      return;
    }

    let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
    points.forEach(p => {
      minX = Math.min(minX, p.x); maxX = Math.max(maxX, p.x);
      minY = Math.min(minY, p.y); maxY = Math.max(maxY, p.y);
    });
    const padX = (maxX - minX) || (Math.abs(maxX) * 0.2 || 1);
    const padY = (maxY - minY) || (Math.abs(maxY) * 0.2 || 1);
    minX -= padX * 0.08; maxX += padX * 0.08;
    minY -= padY * 0.12; maxY += padY * 0.12;

    const sx = x => m.l + (x - minX) / (maxX - minX) * pw;
    const sy = y => m.t + ph - (y - minY) / (maxY - minY) * ph;
    screenPoints = points.map(p => ({x:p.x, y:p.y, px:sx(p.x), py:sy(p.y)}));

    const stepX = niceStep(maxX - minX, 7);
    const stepY = niceStep(maxY - minY, 6);
    const showGrid = $('#opt-grid').checked;

    ctx.font = '11px -apple-system, "PingFang SC", sans-serif';
    ctx.strokeStyle = '#eef1f5';
    ctx.fillStyle = '#8a93a2';
    ctx.lineWidth = 1;

    // 横向网格与 Y 轴刻度
    ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    for(let v = Math.ceil(minY / stepY) * stepY; v <= maxY + stepY * 1e-6; v += stepY){
      const py = sy(v);
      if(showGrid){ ctx.beginPath(); ctx.moveTo(m.l, py); ctx.lineTo(m.l + pw, py); ctx.stroke(); }
      ctx.fillText(tickText(v, stepY), m.l - 9, py);
    }
    // 纵向网格与 X 轴刻度
    ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    for(let v = Math.ceil(minX / stepX) * stepX; v <= maxX + stepX * 1e-6; v += stepX){
      const px = sx(v);
      if(showGrid){ ctx.beginPath(); ctx.moveTo(px, m.t); ctx.lineTo(px, m.t + ph); ctx.stroke(); }
      ctx.fillText(tickText(v, stepX), px, m.t + ph + 9);
    }

    // 坐标轴
    ctx.strokeStyle = '#9ca3af'; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(m.l, m.t); ctx.lineTo(m.l, m.t + ph); ctx.lineTo(m.l + pw, m.t + ph); ctx.stroke();
    ctx.fillStyle = '#6b7280'; ctx.font = '12px -apple-system, "PingFang SC", sans-serif';
    ctx.textAlign = 'right'; ctx.textBaseline = 'top';
    ctx.fillText('m/kg', m.l + pw - 6, m.t + ph + 24);
    ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    ctx.fillText('G/N', m.l - 24, m.t - 22);

    // 曲线路径
    const buildPath = () => {
      const p = screenPoints;
      ctx.beginPath();
      ctx.moveTo(p[0].px, p[0].py);
      if($('#opt-smooth').checked && p.length > 2){
        for(let i = 0; i < p.length - 1; i++){
          const p0 = p[Math.max(0, i - 1)], p1 = p[i], p2 = p[i + 1], p3 = p[Math.min(p.length - 1, i + 2)];
          ctx.bezierCurveTo(
            p1.px + (p2.px - p0.px) / 6, p1.py + (p2.py - p0.py) / 6,
            p2.px - (p3.px - p1.px) / 6, p2.py - (p3.py - p1.py) / 6,
            p2.px, p2.py
          );
        }
      }else{
        for(let i = 1; i < p.length; i++) ctx.lineTo(p[i].px, p[i].py);
      }
    };

    // 曲线下方渐变填充
    const grad = ctx.createLinearGradient(0, m.t, 0, m.t + ph);
    grad.addColorStop(0, 'rgba(37,99,235,.20)');
    grad.addColorStop(1, 'rgba(37,99,235,0)');
    buildPath();
    ctx.lineTo(screenPoints[screenPoints.length - 1].px, m.t + ph);
    ctx.lineTo(screenPoints[0].px, m.t + ph);
    ctx.closePath();
    ctx.fillStyle = grad; ctx.fill();

    buildPath();
    ctx.strokeStyle = '#2563eb'; ctx.lineWidth = 2.4;
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    ctx.stroke();

    // 数据点
    if($('#opt-points').checked){
      screenPoints.forEach((p, i) => {
        ctx.beginPath();
        ctx.arc(p.px, p.py, i === hoverIndex ? 6 : 4, 0, Math.PI * 2);
        ctx.fillStyle = '#ffffff'; ctx.fill();
        ctx.lineWidth = i === hoverIndex ? 3 : 2;
        ctx.strokeStyle = i === hoverIndex ? '#1e3a8a' : '#2563eb';
        ctx.stroke();
      });
    }

    // 图例
    ctx.fillStyle = '#ffffff'; ctx.strokeStyle = '#e5e7eb'; ctx.lineWidth = 1;
    ctx.fillRect(W - 118, 14, 100, 26);
    ctx.strokeRect(W - 118, 14, 100, 26);
    ctx.beginPath(); ctx.moveTo(W - 108, 27); ctx.lineTo(W - 92, 27);
    ctx.strokeStyle = '#2563eb'; ctx.lineWidth = 2.4; ctx.stroke();
    ctx.fillStyle = '#4b5563'; ctx.font = '12px -apple-system, "PingFang SC", sans-serif';
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillText('G = f(m)', W - 86, 27);
  }

  function updateStats(duplicates){
    $('#stat-count').textContent = points.length + ' 个' + (duplicates ? '（合并 ' + duplicates + ' 个重复 m）' : '');
    if(points.length){
      const xs = points.map(p => p.x), ys = points.map(p => p.y);
      $('#stat-x').textContent = fmt(Math.min(...xs)) + ' ~ ' + fmt(Math.max(...xs));
      $('#stat-y').textContent = fmt(Math.min(...ys)) + ' ~ ' + fmt(Math.max(...ys));
      $('#stat-type').textContent = $('#opt-smooth').checked ? '平滑曲线' : '折线';
    }else{
      $('#stat-x').textContent = $('#stat-y').textContent = $('#stat-type').textContent = '—';
    }
  }

  function generate(){
    try{
      const result = collect();
      points = result.points;
      hoverIndex = -1;
      tooltip.style.display = 'none';
      draw();
      updateStats(result.duplicates);
      setMessage('已生成曲线：共 ' + points.length + ' 个有效数据点。' + (result.duplicates ? ' 相同 m 已自动合并取平均。' : ''), 'ok');
    }catch(err){
      setMessage(err.message, 'error');
    }
  }

  // 事件绑定
  $('#add-row').addEventListener('click', () => addRow());
  $('#generate').addEventListener('click', generate);

  $('#sample').addEventListener('click', () => {
    $('#tab-table').classList.add('active'); $('#tab-paste').classList.remove('active');
    $('#panel-table').hidden = false; $('#panel-paste').hidden = true;
    loadRows(SAMPLE);
    $('#paste').value = '';
    generate();
  });

  $('#clear').addEventListener('click', () => {
    $('#rows').innerHTML = '';
    addRow();
    $('#paste').value = '';
    points = []; hoverIndex = -1;
    tooltip.style.display = 'none';
    draw(); updateStats(0);
    setMessage('已清空，请录入新的 m（kg）与 G（N）数值。');
  });

  function switchTab(tab){
    $('#tab-table').classList.toggle('active', tab === 'table');
    $('#tab-paste').classList.toggle('active', tab === 'paste');
    $('#panel-table').hidden = tab !== 'table';
    $('#panel-paste').hidden = tab !== 'paste';
    setMessage(tab === 'table' ? '逐点录入：每行填写一对 m（kg）、G（N）数值。' : '批量粘贴：每行一个点，格式如 1, 9.8');
  }
  $('#tab-table').addEventListener('click', () => switchTab('table'));
  $('#tab-paste').addEventListener('click', () => switchTab('paste'));

  ['opt-smooth','opt-points','opt-grid'].forEach(id => {
    $('#' + id).addEventListener('change', () => { draw(); updateStats(0); });
  });

  $('#export').addEventListener('click', () => {
    if(points.length < 2){ setMessage('还没有曲线可以导出。', 'error'); return; }
    const url = canvas.toDataURL('image/png');
    const a = document.createElement('a');
    a.href = url; a.download = 'G-m关系曲线.png';
    document.body.appendChild(a); a.click(); a.remove();
    setMessage('曲线图片已导出。', 'ok');
  });

  canvas.addEventListener('mousemove', e => {
    if(!screenPoints.length) return;
    const r = canvas.getBoundingClientRect();
    const mx = e.clientX - r.left, my = e.clientY - r.top;
    let best = -1, bestD = 22;
    screenPoints.forEach((p, i) => {
      const d = Math.hypot(p.px - mx, p.py - my);
      if(d < bestD){ bestD = d; best = i; }
    });
    if(best !== hoverIndex){ hoverIndex = best; draw(); }
    if(best >= 0){
      const p = screenPoints[best];
      tooltip.textContent = 'm = ' + fmt(p.x) + ' kg   G = ' + fmt(p.y) + ' N';
      tooltip.style.display = 'block';
      tooltip.style.left = Math.max(70, Math.min(r.width - 70, p.px)) + 'px';
      tooltip.style.top = (p.py - 2) + 'px';
    }else{
      tooltip.style.display = 'none';
    }
  });
  canvas.addEventListener('mouseleave', () => {
    if(hoverIndex !== -1){ hoverIndex = -1; draw(); }
    tooltip.style.display = 'none';
  });

  let resizeTimer;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(draw, 80);
  });

  // 初始状态
  loadRows(SAMPLE);
  draw();
  updateStats(0);
})();
</script>
</body>
</html>
